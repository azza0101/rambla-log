name: Repair iPhone update metadata
on:
  push:
    branches: [main]
    paths: ['.github/workflows/repair-phone-release.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reproduce invalid metadata, repair and test installed updater
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import {readFileSync,writeFileSync,mkdirSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import assert from 'node:assert/strict';
          import vm from 'node:vm';
          const before=JSON.parse(readFileSync('version.json','utf8'));
          const html=readFileSync('index.html','utf8');
          const portable=readFileSync('RAMBLA-Log.html','utf8');
          const sw=readFileSync('sw.js','utf8');
          const buildPattern=/window\.RAMBLA_BUILD=\{version:"([^"]+)",build:"([^"]+)"\};/;
          assert.equal(before.version,'1.5.0','Repair only the known broken release');
          assert.equal(before.build,'bridge015-phone-layout');
          assert.equal(buildPattern.exec(html)?.[2],before.build);
          assert.equal(buildPattern.exec(portable)?.[2],before.build);
          function updateFunction(source){
            const start=source.indexOf('  async function updateApp() {');
            const end=source.indexOf('  function loadStore() {',start);
            assert.ok(start>=0&&end>start,'Find actual updater in app');
            return source.slice(start,end);
          }
          const updater=updateFunction(html);
          async function replay(source,installed,published,options={}){
            const result={messages:[],navigation:[],saves:0,requests:0};
            const archive=JSON.stringify({version:1,activeId:'existing-session',sessions:[{id:'existing-session',title:'Riprese',markers:[{id:'existing-marker',note:'Nota da conservare'}]}]});
            let stored=archive;
            const env={window:{RAMBLA_BUILD:installed},location:{protocol:'https:',href:'https://azza0101.github.io/rambla-log/',replace:url=>result.navigation.push(url)},navigator:{onLine:options.online!==false},URL,Date,updatingApp:false,active:!!options.active,pendingFlush:false,voiceNote:null,voiceClosing:null,scanner:null,renderAppUpdate(){},notify:msg=>result.messages.push(msg),persist(){result.saves++;return options.save!==false;},localStorage:{getItem:()=>stored,setItem:(_,value)=>{stored=value;},removeItem:()=>{stored=null;},clear:()=>{stored=null;}},fetch:async()=>{result.requests++;return {ok:true,json:async()=>published};}};
            await vm.runInNewContext(source+'\nupdateApp();',env);
            assert.equal(stored,archive,'Update must preserve existing sessions and notes');
            return result;
          }
          const broken=await replay(updater,{version:'1.3.0',build:'b725dffdd45b'},before);
          assert.equal(broken.navigation.length,0);
          assert.ok(broken.messages.some(m=>m.includes('Non riesco a verificare')),'Reproduce the exact error reported by the iPhone');
          console.log('REPRODUCED: installed updater rejects bridge015-phone-layout.');
          const version='1.5.1';
          const normalized=html.replace(buildPattern,`window.RAMBLA_BUILD={version:"${version}",build:"__BUILD__"};`).replace('RAMBLA LOG <b>1.5</b>','RAMBLA LOG <b>1.5.1</b>');
          const build=createHash('sha256').update(normalized).digest('hex').slice(0,12);
          const metadata=`window.RAMBLA_BUILD={version:"${version}",build:"${build}"};`;
          const fixed=normalized.replace('window.RAMBLA_BUILD={version:"1.5.1",build:"__BUILD__"};',metadata);
          const fixedPortable=portable.replace(buildPattern,metadata).replace('RAMBLA LOG <b>1.5</b>','RAMBLA LOG <b>1.5.1</b>');
          const fixedSW=sw.replace(/const CACHE='rambla-log-[^']+';/,`const CACHE='rambla-log-${build}';`);
          assert.notEqual(fixedSW,sw,'Update offline cache identity too');
          const release={version,build};
          assert.match(build,/^[a-f0-9]{12}$/,'Legacy update protocol');
          for(const source of [fixed,fixedPortable]){
            const match=buildPattern.exec(source);assert.equal(match[1],version);assert.equal(match[2],build);
            for(const item of source.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g))new vm.Script(item[1]);
          }
          const upgraded=await replay(updater,{version:'1.3.0',build:'b725dffdd45b'},release);
          assert.equal(upgraded.navigation.length,1);assert.equal(new URL(upgraded.navigation[0]).searchParams.get('v'),build);assert.equal(upgraded.saves,2);
          const repaired15=await replay(updater,before,release);assert.equal(repaired15.navigation.length,1);
          const current=await replay(updateFunction(fixed),release,release);assert.equal(current.navigation.length,0);assert.ok(current.messages.some(m=>m.includes('già aggiornata')));
          const recording=await replay(updater,before,release,{active:true});assert.equal(recording.navigation.length,0);assert.equal(recording.requests,0);
          const offline=await replay(updater,before,release,{online:false});assert.equal(offline.navigation.length,0);assert.equal(offline.requests,0);
          const unsaved=await replay(updater,before,release,{save:false});assert.equal(unsaved.navigation.length,0);assert.equal(unsaved.requests,0);
          writeFileSync('index.html',fixed);writeFileSync('RAMBLA-Log.html',fixedPortable);writeFileSync('sw.js',fixedSW);writeFileSync('version.json',JSON.stringify(release)+'\n');
          mkdirSync('tests',{recursive:true});
          writeFileSync('tests/phone-release.test.mjs',`import {readFileSync} from 'node:fs';\nimport assert from 'node:assert/strict';\nimport {test} from 'node:test';\nconst release=JSON.parse(readFileSync('version.json','utf8'));\ntest('Published build is accepted by installed iPhone updaters',()=>{assert.match(release.build,/^[a-f0-9]{12}$/);assert.match(release.version,/^\\d+\\.\\d+\\.\\d+$/);});\nfor(const name of ['index.html','RAMBLA-Log.html'])test(name+' advertises the published release',()=>{const html=readFileSync(name,'utf8');assert.ok(html.includes('window.RAMBLA_BUILD={version:"'+release.version+'",build:"'+release.build+'"};'));});\ntest('Offline cache belongs to the published build',()=>{assert.ok(readFileSync('sw.js','utf8').includes("const CACHE='rambla-log-"+release.build+"';"));});\n`);
          console.log('PASS: old 1.3 updates, broken 1.5 updates, current version no reload, active/offline/unsaved guards, unchanged storage.');
          console.log('FIXED RELEASE: '+JSON.stringify(release));
          JS
      - name: Run persistent release regression tests
        run: node --test tests/phone-release.test.mjs
      - name: Existing Bridge tests
        run: python -m unittest discover -s bridge -p 'test_*.py' -v
      - name: Stage validated repair on its own branch
        shell: bash
        run: |
          git config user.name 'RAMBLA release maintenance'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c fix/phone-update-metadata-${{ github.run_id }}
          git add index.html RAMBLA-Log.html sw.js version.json tests/phone-release.test.mjs
          git commit -m 'Fix iPhone updater compatibility with canonical 12-hex release build (1.5.1)'
          git push origin HEAD:refs/heads/fix/phone-update-metadata-${{ github.run_id }}
          git rev-parse HEAD
