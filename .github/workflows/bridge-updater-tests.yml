name: RAMBLA Bridge Updater CI
on:
  push:
    branches: [feat/bridge-autoupdate-progress, main]
    paths: ["bridge/**", ".github/workflows/bridge-updater-tests.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test parser and update staging
        run: python -m unittest discover -s bridge -p "test_*.py" -v
      - name: Validate Python syntax
        run: python -m compileall -q bridge
