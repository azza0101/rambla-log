name: Extract canonical KURA paper-note assets
on:
  push:
    branches: [main]
    paths:
      - 'kura-editor/tools/extract_postit_assets.py'
      - '.github/workflows/kura-extract-note-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image dependencies
        run: pip install pillow numpy
      - name: Extract original KURA ink, printed icons and paper
        run: python kura-editor/tools/extract_postit_assets.py
      - name: Publish actual transparent PNG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kura-editor/assets/postit-canon/
          if ! git diff --cached --quiet; then
            git commit -m "KURA: publish eight separate canonical note PNG assets from approved original"
            git push
          fi
