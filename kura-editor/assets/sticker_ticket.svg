<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" width="420" height="420" role="img" aria-label="KURA decorazione ticket"><defs><filter id="grain" x="-22%" y="-22%" width="144%" height="144%" color-interpolation-filters="sRGB">
